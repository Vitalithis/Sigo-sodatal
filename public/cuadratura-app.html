<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cuadratura Sodatal</title>
<style>
:root{
  --azul:#15568f; --azul-osc:#0e3f6b; --azul-med:#a9cdea; --azul-cl:#e9f1f9;
  --verde:#5a9e1f; --verde-bg:#ecf6df; --verde-cell:#a3cf5f;
  --rojo:#c93a3a; --rojo-bg:#fdecec;
  --ambar:#b97d10; --ambar-bg:#fdf3dc;
  --morado:#6b4fa0; --morado-bg:#f0eaf9;
  --tinta:#1c2733; --gris:#5b6b7b; --borde:#c9d6e2; --fondo:#eef3f8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--tinta);font-size:15px;padding-bottom:76px}
h1,h2,h3{margin:0}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--borde);border-radius:8px;padding:8px 10px;background:#fff;color:var(--tinta);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul-med);border-color:var(--azul)}
input[type=number]{text-align:right}
input.num-sm{width:64px;text-align:center;padding:6px 4px}
label{font-size:12px;font-weight:600;color:var(--gris);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.02em}

/* ---------- barra superior ---------- */
.topbar{background:var(--azul);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(14,63,107,.25)}
.logo{font-weight:800;font-size:19px;letter-spacing:.02em;font-style:italic}
.logo small{font-weight:400;font-style:normal;opacity:.85;display:block;font-size:11px;letter-spacing:.06em}
.top-info{margin-left:auto;text-align:right;font-size:12px;line-height:1.35;opacity:.95}

/* ---------- navegación ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borde);display:flex;z-index:60;box-shadow:0 -2px 10px rgba(20,40,60,.08)}
.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;font-weight:600;color:var(--gris);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button .ic{width:22px;height:22px;display:block}
.tabs button .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--azul)}
.tabs button.on::after{content:"";position:absolute;top:0;width:34px;height:3px;background:var(--azul);border-radius:0 0 3px 3px}
.tabs button{position:relative}
.tab-dot{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--rojo)}

/* ---------- layout ---------- */
.wrap{max-width:880px;margin:0 auto;padding:12px 12px 20px}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,60,.05)}
.card h2{font-size:15px;color:var(--azul-osc);margin-bottom:10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.03em}
.card h2 .tag{margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{margin-top:10px}
.muted{color:var(--gris);font-size:13px}
.small{font-size:12.5px}
hr{border:0;border-top:1px dashed var(--borde);margin:12px 0}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--azul);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.btn.ghost{background:var(--azul-cl);color:var(--azul-osc);border:0}
.btn.verde{background:var(--verde)}
.btn.rojo{background:var(--rojo)}
.btn.mini{padding:5px 10px;font-size:12.5px;border-radius:7px;font-weight:600}
.btn.wide{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- chips / badges ---------- */
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.t-azul{background:var(--azul-cl);color:var(--azul-osc)}
.t-verde{background:var(--verde-bg);color:var(--verde)}
.t-rojo{background:var(--rojo-bg);color:var(--rojo)}
.t-ambar{background:var(--ambar-bg);color:var(--ambar)}
.t-morado{background:var(--morado-bg);color:var(--morado)}
.t-gris{background:#eef1f5;color:var(--gris)}

/* ---------- paradas ---------- */
.zona{font-size:12px;font-weight:800;color:var(--azul-osc);background:var(--azul-med);padding:5px 10px;border-radius:7px;margin:14px 0 8px;letter-spacing:.04em;text-transform:uppercase}
.parada{background:#fff;border:1px solid var(--borde);border-left:4px solid var(--gris);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.parada.p-entregado{border-left-color:var(--verde);background:linear-gradient(0deg,rgba(122,193,67,.05),rgba(122,193,67,.05)),#fff}
.parada.p-no{border-left-color:var(--rojo);opacity:.75}
.parada.p-pend{border-left-color:#b8c4d0}
.parada .dir{font-weight:700;font-size:14.5px}
.parada .linea2{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.parada .obs{color:var(--gris);font-size:12.5px;margin-top:4px;font-style:italic}
.parada .monto-p{margin-left:auto;font-weight:800;font-size:14px}

/* ---------- editor de parada (hoja modal) ---------- */
.velo{position:fixed;inset:0;background:rgba(15,30,45,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 26px;animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.hoja h3{font-size:16px;color:var(--azul-osc);margin-bottom:2px}
.prod-linea{display:grid;grid-template-columns:1fr 62px 86px 30px;gap:6px;align-items:center;margin-bottom:6px}
.prod-linea .del{background:none;border:0;color:var(--rojo);font-size:18px;cursor:pointer;padding:2px}
.pago-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pago-btns button{border:1.5px solid var(--borde);background:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--gris)}
.pago-btns button.on{border-color:var(--azul);background:var(--azul-cl);color:var(--azul-osc)}
.estado-btns{display:flex;gap:6px;margin-top:4px}
.estado-btns button{flex:1;border:1.5px solid var(--borde);background:#fff;border-radius:8px;padding:9px 4px;font-size:13px;font-weight:700;cursor:pointer;color:var(--gris)}
.estado-btns button.e-ent.on{border-color:var(--verde);background:var(--verde-bg);color:var(--verde)}
.estado-btns button.e-pend.on{border-color:var(--gris);background:#eef1f5;color:var(--tinta)}
.estado-btns button.e-no.on{border-color:var(--rojo);background:var(--rojo-bg);color:var(--rojo)}
.sugerencia{background:var(--ambar-bg);border:1px dashed var(--ambar);border-radius:9px;padding:8px 10px;font-size:13px;margin:8px 0}

/* ---------- tablas ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:var(--azul-med);color:var(--azul-osc);padding:6px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em}
table.t td{border-bottom:1px solid #e4ebf2;padding:5px 4px;text-align:center}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t td.der,table.t th.der{text-align:right}
table.t input{padding:6px 4px}
tr.total-row td{font-weight:800;background:var(--azul-cl);border-bottom:0}
.chk-ok{color:var(--verde);font-weight:800}
.chk-bad{color:var(--rojo);font-weight:800}

/* ---------- dinero ---------- */
.dinero-linea{display:grid;grid-template-columns:1fr 58px 84px 92px;gap:6px;align-items:center;margin-bottom:6px;font-size:13.5px}
.dinero-linea .nom{font-weight:600}
.dinero-linea .tot{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ing-linea{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin-bottom:7px}
.ing-linea .nom{font-weight:700;font-size:13.5px}
.ing-linea .auto-hint{font-weight:400;color:var(--gris);font-size:11.5px;display:block}
.totalote{display:flex;justify-content:space-between;align-items:center;background:var(--azul);color:#fff;border-radius:10px;padding:12px 14px;font-weight:800;font-size:16px;margin-top:10px}
.totalote.verde{background:var(--verde)}
.totalote.rojo{background:var(--rojo)}
.totalote small{font-weight:500;opacity:.9;font-size:12px;display:block}

/* ---------- resumen ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:11px;padding:10px 12px}
.kpi .k-lab{font-size:11.5px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.03em}
.kpi .k-val{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.k-verde{border-color:var(--verde);background:var(--verde-bg)}
.kpi.k-rojo{border-color:var(--rojo);background:var(--rojo-bg)}
.estado-banner{border-radius:12px;padding:14px;text-align:center;font-weight:800;font-size:17px;margin-bottom:12px;border:2px solid}
.estado-banner.ok{background:var(--verde-bg);border-color:var(--verde);color:var(--verde)}
.estado-banner.bad{background:var(--rojo-bg);border-color:var(--rojo);color:var(--rojo)}
.estado-banner small{display:block;font-weight:600;font-size:12.5px;margin-top:3px}
.cobro-item{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--rojo);background:var(--rojo-bg);border-radius:9px;margin-bottom:6px;font-size:13.5px;align-items:center}
.cobro-item b{font-variant-numeric:tabular-nums}

/* ---------- subida de archivo ---------- */
.drop{border:2px dashed var(--azul-med);border-radius:12px;padding:22px 14px;text-align:center;color:var(--azul-osc);background:var(--azul-cl);cursor:pointer;font-weight:600}
.drop input{display:none}
.bloque-pick{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bloque-pick .bp{display:flex;align-items:center;gap:10px;border:1.5px solid var(--borde);border-radius:10px;padding:10px;cursor:pointer;font-size:13.5px}
.bloque-pick .bp.on{border-color:var(--azul);background:var(--azul-cl)}
.bloque-pick .bp input{width:auto}

/* ---------- impresión ---------- */
#printview{display:none}
@media print{
  body{background:#fff;padding:0;font-size:11px}
  .app-ui{display:none !important}
  #printview{display:block}
  .pagina{page-break-after:always;padding:6mm 2mm}
  .pagina:last-child{page-break-after:auto}
  table.pt{width:100%;border-collapse:collapse;font-size:10.5px}
  table.pt th,table.pt td{border:1px solid #444;padding:3px 5px}
  table.pt th{background:#dce9f5 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pt-titulo{text-align:center;font-weight:800;font-size:15px;margin:4px 0 8px}
  .pt-head{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}
  .pt-secc{font-weight:800;background:#a9cdea !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:3px 6px;border:1px solid #444;font-size:11px;margin-top:8px}
  .pt-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pt-firma{margin-top:34px;display:flex;justify-content:space-around;text-align:center;font-size:10.5px}
  .pt-firma div{border-top:1px solid #333;padding-top:3px;width:180px}
  .pt-alerta{border:2px solid #c93a3a;padding:6px 8px;margin-top:8px;font-size:11px}
  .no-print{display:none !important}
}
@media (min-width:700px){
  .tabs{position:sticky;top:52px;bottom:auto;border-top:0;border-bottom:1px solid var(--borde)}
  body{padding-bottom:20px}
  .kpis{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="app-ui">
<div class="topbar">
  <div class="logo">Sodatal<small>CUADRATURA DIARIA</small></div>
  <div class="top-info" id="topInfo"></div>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="inicio" class="on"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6 10.5V19h12v-8.5"/></svg></span>Día</button>
  <button data-tab="pedidos"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/><path d="M9 13h7M9 16.5h7"/></svg></span>Pedidos</button>
  <button data-tab="carga"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 17V8h11v9M14 10h4l3 3v4h-3M3 17h18"/><circle cx="7" cy="18.5" r="1.7"/><circle cx="17" cy="18.5" r="1.7"/></svg></span>Carga</button>
  <button data-tab="dinero"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3"/><path d="M3 11h2M19 15h2"/></svg></span>Dinero</button>
  <button data-tab="resumen" id="tabResumen"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>Resumen</button>
</nav>

<main class="wrap">
  <section id="v-inicio"></section>
  <section id="v-pedidos" style="display:none"></section>
  <section id="v-carga" style="display:none"></section>
  <section id="v-dinero" style="display:none"></section>
  <section id="v-resumen" style="display:none"></section>
</main>
</div>

<div id="modal"></div>
<div id="printview"></div>
<input type="file" id="filePedidos" accept=".xlsx,.xlsm" style="display:none">
<input type="file" id="fileRespaldo" accept=".json,application/json" style="display:none">
<script>
/* ============================================================
   CUADRATURA SODATAL — núcleo de datos y cálculo
   ============================================================ */
'use strict';

/* ---------- Catálogo (precios junio 2026, editables en la app) ---------- */
const PRODUCTOS=[
 {id:'REC_SODA',   nombre:'Recarga soda 1.500 cc',                 corto:'Rec. soda',      precio:1000,  grupo:'SODA'},
 {id:'SODA_NUEVA', nombre:'Soda nueva cargada',                    corto:'Soda nueva',     precio:6000,  grupo:'SODA'},
 {id:'KIT6_SIF',   nombre:'Kit 6 sifones nuevos',                  corto:'Kit 6 sifones',  precio:36000, grupo:'SODA'},
 {id:'REC_BOT20',  nombre:'Recarga botellón 20 L',                 corto:'Rec. bot 20',    precio:3500,  grupo:'BOT20'},
 {id:'CAMBIO_ENV', nombre:'Cambio de envase a Sodatal',            corto:'Cambio env.',    precio:4000,  grupo:'BOT20'},
 {id:'BOT20_ENV',  nombre:'Botellón 20 L nuevo (envase Sodatal)',  corto:'Bot 20 nuevo',   precio:10000, grupo:'BOT20'},
 {id:'BOT20_ENV_GEN',nombre:'Botellón 20 L nuevo (envase genérico)',corto:'Bot 20 genér.', precio:8000,  grupo:'BOT20'},
 {id:'REC_BOT10',  nombre:'Recarga botellón 10 L',                 corto:'Rec. bot 10',    precio:2000,  grupo:'BOT10'},
 {id:'BOT10_NUEVO',nombre:'Botellón 10 L nuevo',                   corto:'Bot 10 nuevo',   precio:7000,  grupo:'BOT10'},
 {id:'BOMBA_USB',  nombre:'Bomba dispensadora USB',                corto:'Bomba USB',      precio:9000,  grupo:'ACC'},
 {id:'BOMBA_PREM', nombre:'Bomba USB premium',                     corto:'Bomba premium',  precio:13000, grupo:'ACC'},
 {id:'FUENTE_MESA',nombre:'Dispensador de mesa manual',            corto:'Fuente mesa',    precio:9000,  grupo:'ACC'},
 {id:'DISP_ELEC',  nombre:'Dispensador eléctrico sobremesa',       corto:'Disp. eléctrico',precio:60000, grupo:'ACC'},
 {id:'DISP_PED',   nombre:'Dispensador pedestal compresor',        corto:'Disp. pedestal', precio:119000,grupo:'ACC'},
 {id:'DISP_FRIGO', nombre:'Dispensador pedestal frigobar',         corto:'Disp. frigobar', precio:130900,grupo:'ACC'},
 {id:'DISP_3LL',   nombre:'Dispensador pedestal 3 llaves',         corto:'Disp. 3 llaves', precio:149000,grupo:'ACC'},
 {id:'VASO_PLAST', nombre:'Vasos plásticos 300 cc (50 u)',         corto:'Vasos plást.',   precio:2000,  grupo:'ACC'},
 {id:'VASO_POLI_SL',nombre:'Vasos polipapel s/logo (50 u)',        corto:'Vasos poli s/l', precio:3000,  grupo:'ACC'},
 {id:'VASO_POLI_CL',nombre:'Vasos polipapel c/logo (50 u)',        corto:'Vasos poli c/l', precio:3500,  grupo:'ACC'},
 {id:'VASO_CONO',  nombre:'Vasos cono polipapel (200 u)',          corto:'Vasos cono',     precio:5000,  grupo:'ACC'},
 {id:'SET2_MESA',  nombre:'Set 2 bot 20L + disp. mesa',            corto:'Set 2+mesa',     precio:27000, grupo:'SET'},
 {id:'SET3_MESA',  nombre:'Set 3 bot 20L + disp. mesa',            corto:'Set 3+mesa',     precio:35000, grupo:'SET'},
 {id:'SET2_USB',   nombre:'Set 2 bot 20L + bomba USB',             corto:'Set 2+USB',      precio:27000, grupo:'SET'},
 {id:'SET3_USB',   nombre:'Set 3 bot 20L + bomba USB',             corto:'Set 3+USB',      precio:35000, grupo:'SET'},
 {id:'SET2_USBP',  nombre:'Set 2 bot 20L + USB premium',           corto:'Set 2+USB pr.',  precio:31000, grupo:'SET'},
 {id:'SET3_USBP',  nombre:'Set 3 bot 20L + USB premium',           corto:'Set 3+USB pr.',  precio:39000, grupo:'SET'},
 {id:'SET3_10USB', nombre:'Set 3 bot 10L + bomba USB',             corto:'Set 10L+USB',    precio:29000, grupo:'SET'},
 {id:'SET3_10FM',  nombre:'Set 3 bot 10L + fuente mesa',           corto:'Set 10L+mesa',   precio:29000, grupo:'SET'},
 {id:'OTRO',       nombre:'Otro (precio libre)',                   corto:'Otro',           precio:0,     grupo:'OTRO'},
];
const PROD=Object.fromEntries(PRODUCTOS.map(p=>[p.id,p]));

const PAGOS={
  EF:    {n:'Efectivo',            tag:'EFECTIVO',     cls:'t-verde',  rinde:true},
  TA_BOL:{n:'Tarjeta (boleta)',    tag:'TARJETA BOL',  cls:'t-ambar',  rinde:true},
  TA_FAC:{n:'Tarjeta (factura)',   tag:'TARJETA FAC',  cls:'t-ambar',  rinde:true},
  TRANSF:{n:'Transferencia',       tag:'TRANSFER.',    cls:'t-morado', rinde:true},
  CHEQUE:{n:'Cheque',              tag:'CHEQUE',       cls:'t-gris',   rinde:true},
  WEB:   {n:'Pagado página web',   tag:'WEB',          cls:'t-azul',   rinde:false},
  CR:    {n:'Crédito (guía/fact.)',tag:'CRÉDITO',      cls:'t-azul',   rinde:false},
  DEUDA: {n:'Queda debiendo',      tag:'DEUDA',        cls:'t-rojo',   rinde:true},
};

/* Filas fijas del lado "A RENDIR" (siempre visibles, como en el papel) */
const RENDIR_BASE=['REC_SODA','SODA_NUEVA','REC_BOT20','REC_BOT10'];
const CREDITO_BASE=['REC_SODA','SODA_NUEVA','REC_BOT20','BOT20_ENV'];

/* ---------- Estado ---------- */
function estadoNuevo(){
  return {
    version:1,
    fecha:new Date().toISOString().slice(0,10),
    vendedor:'', furgon:'', ruta:'', kmIni:'', kmFin:'',
    precios:Object.fromEntries(PRODUCTOS.map(p=>[p.id,p.precio])),
    paradas:[],           // {id,zona,dir,botTxt,sodaTxt,contacto,obs,sug,estado:'pend'|'ent'|'no',pago,productos:[{prod,glosa,cant,precio}],transferOk,cobroExtra,nota,origen}
    vueltas:[vueltaVacia()],
    accesorios:{salida:{},venta:{}},
    combustible:{tipo:'',monto:'',factura:'',rut:''},
    rendirManual:{}, rendirPrecio:{}, rendirExtra:[],   // extra: {glosa,cant,precio}
    creditoManual:{},
    ingresosManual:{EF:null,CHEQUE:null,TA_BOL:null,TA_FAC:null,TRANSF:null,DEUDA:null},
    transfExtra:[],       // {nombre,monto,pagado}
    deudasExtra:[],       // {nombre,monto}
    pagosDeudasManual:null, gastos:0, gastosDetalle:'',
    archivoPedidos:null,  // nombre del excel cargado
  };
}
function vueltaVacia(){
  return {sif:{salida:0,recarga:0,llenos:0,vendidos:0,cambios:0},
          b20:{salida:0,recarga:0,llenos:0,cambios:0,venta:0},
          b10:{salida:0,recarga:0,llenos:0,cambios:0,venta:0}};
}
let state=estadoNuevo();
let ui={tab:'inicio', filtro:'todos', editParada:null, importa:null};

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const fmt$=n=>'$'+(Math.round(+n||0)).toLocaleString('es-CL');
const num=v=>{const n=parseFloat(String(v??'').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ============================================================
   LECTOR XLSX (sin librerías: ZIP + XML nativos del navegador)
   ============================================================ */
async function leerXlsx(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0) throw new Error('El archivo no parece ser un Excel (.xlsx) válido.');
  const total=dv.getUint16(eocd+10,true), cdOfs=dv.getUint32(eocd+16,true);
  const entradas={}; let p=cdOfs;
  const td=new TextDecoder();
  for(let n=0;n<total;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    entradas[td.decode(u8.subarray(p+46,p+46+nl))]={method,csize,lho};
    p+=46+nl+el+cl;
  }
  async function extraer(nombre){
    const e=entradas[nombre]; if(!e) return null;
    const nl=dv.getUint16(e.lho+26,true), el=dv.getUint16(e.lho+28,true);
    const ini=e.lho+30+nl+el;
    const comp=u8.subarray(ini,ini+e.csize);
    if(e.method===0) return td.decode(comp);
    const stream=new Blob([comp]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return td.decode(await new Response(stream).arrayBuffer());
  }
  const xml=s=>new DOMParser().parseFromString(s,'text/xml');

  // hojas y su archivo
  const wbDoc=xml(await extraer('xl/workbook.xml'));
  const relsTxt=await extraer('xl/_rels/workbook.xml.rels');
  const rels={};
  if(relsTxt){ for(const r of xml(relsTxt).getElementsByTagName('Relationship')){
    let t=r.getAttribute('Target')||''; t=t.replace(/^\//,''); if(!t.startsWith('xl/')) t='xl/'+t;
    rels[r.getAttribute('Id')]=t;
  }}
  const hojas=[...wbDoc.getElementsByTagName('sheet')].map((s,i)=>({
    nombre:s.getAttribute('name')||('Hoja'+(i+1)),
    archivo:rels[s.getAttribute('r:id')]||('xl/worksheets/sheet'+(i+1)+'.xml')
  }));

  // shared strings
  const sst=[]; const sstTxt=await extraer('xl/sharedStrings.xml');
  if(sstTxt){ for(const si of xml(sstTxt).getElementsByTagName('si')){
    sst.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  }}

  const colIdx=ref=>{const m=String(ref).match(/^[A-Z]+/); if(!m) return 0;
    let c=0; for(const ch of m[0]) c=c*26+(ch.charCodeAt(0)-64); return c-1;};

  async function matriz(archivo){
    const t=await extraer(archivo); if(!t) return [];
    const doc=xml(t); const filas=[];
    for(const row of doc.getElementsByTagName('row')){
      const r=parseInt(row.getAttribute('r'))||(filas.length+1);
      const arr=[];
      for(const c of row.getElementsByTagName('c')){
        const col=colIdx(c.getAttribute('r')||''); const tp=c.getAttribute('t'); let val=null;
        if(tp==='inlineStr'){ const tn=c.getElementsByTagName('t')[0]; val=tn?tn.textContent:''; }
        else{ const v=c.getElementsByTagName('v')[0];
          if(v){ if(tp==='s') val=sst[parseInt(v.textContent)]??'';
            else if(tp==='str'||tp==='e') val=v.textContent;
            else if(tp==='b') val=(v.textContent==='1'?'VERDADERO':'FALSO');
            else{ const n=parseFloat(v.textContent); val=isNaN(n)?v.textContent:n; } } }
        if(val!==null&&val!=='') arr[col]=val;
      }
      if(arr.length) filas[r-1]=arr;
    }
    return filas;
  }
  return {hojas, matriz};
}

/* ============================================================
   INTERPRETACIÓN DE LA HOJA DE PEDIDOS
   ============================================================ */
function parsearBloques(mat){
  let hr=-1, cols=[];
  for(let r=0;r<Math.min(8,mat.length);r++){
    const row=mat[r]||[]; const idx=[];
    row.forEach((v,i)=>{ if(typeof v==='string'&&/DIRECCI/i.test(v)) idx.push(i); });
    if(idx.length){hr=r;cols=idx;break;}
  }
  if(hr<0) return [];
  const fila1=mat[0]||[];
  const bloques=cols.map(c=>{
    let titulo='';
    for(let i=c;i>=0;i--){ const v=fila1[i];
      if(typeof v==='string'&&v.trim()&&!/^(VERDADERO|FALSO)$/.test(v.trim())){titulo=v.trim();break;} }
    return {col:c,titulo:titulo||('Columna '+(c+1)),filas:[]};
  });
  // evitar que dos bloques hereden el mismo título de la izquierda
  for(let i=1;i<bloques.length;i++){
    if(bloques[i].titulo===bloques[i-1].titulo){
      for(let j=bloques[i].col;j>bloques[i-1].col;j--){
        const v=fila1[j]; if(typeof v==='string'&&v.trim()){bloques[i].titulo=v.trim();break;}
      }
      if(bloques[i].titulo===bloques[i-1].titulo) bloques[i].titulo+=' (2)';
    }
  }
  for(let r=hr+1;r<mat.length;r++){
    const row=mat[r]||[];
    for(const b of bloques){
      const g=k=>{const v=row[b.col+k]; return v==null?'':String(v).trim();};
      const dir=g(0),bot=g(1),soda=g(2),cont=g(3),obs=g(4);
      const tiene=bot||soda||cont||obs;
      if(!dir&&!tiene) continue;
      if(!dir&&/^1[\.,]?5\s*L?T?S?\.?$/i.test(soda)&&!bot&&!cont) continue; // subencabezado "1.5 LTS"
      if(/^(VERDADERO|FALSO)$/i.test(dir)) continue;
      if(dir&&!tiene) b.filas.push({tipo:'zona',nombre:dir});
      else b.filas.push({tipo:'cliente',dir,bot,soda,contacto:cont,obs});
    }
  }
  bloques.forEach(b=>{ // limpiar zonas colgantes al final
    while(b.filas.length&&b.filas[b.filas.length-1].tipo==='zona') b.filas.pop();
  });
  return bloques.filter(b=>b.filas.some(f=>f.tipo==='cliente'));
}

/* --- clasificación de la observación (SIEMPRE es sugerencia: hay que confirmar) --- */
function parseMonto(s){ const n=parseInt(String(s).replace(/[.,\s]/g,''),10); return isNaN(n)?null:n; }
function clasificarObs(obs){
  const o=String(obs||'').toUpperCase();
  const res={pago:null,monto:null,transferOk:false,cobroExtra:null,web:null,notas:[]};
  if(!o.trim()) return res;
  const web=o.match(/(?:PEDIDO\s*#?\s*|P\s*#?\s*)(\d{3,5})/);
  if(web){ res.pago='WEB'; res.web=web[1]; }
  const vaAPagar=/VA A TRA|TRA\w*FERIR|POR TRANSFER|POR PAGAR/.test(o);
  const yaPago=/TRA\w*FERID|TRA\w*FIRI|PAGADO|PAG[OÓ]\s|YA PAG/.test(o)&&!vaAPagar;
  if(!res.pago&&(yaPago||vaAPagar)){ res.pago='TRANSF'; res.transferOk=yaPago&&!vaAPagar; }
  else if(res.pago==='WEB'&&yaPago){ res.notas.push('pago confirmado'); }
  if(!res.pago&&/(^|[\s,;])TA([\s,;.]|$)/.test(o)) res.pago='TA_BOL';
  if(!res.pago&&(/(^|[\s,;])EF([\s,;.]|$)/.test(o)||/EFECTIVO/.test(o))) res.pago='EF';
  if(!res.pago&&(/(^|[\s,;])CR([\s,;.]|$)/.test(o)||/GU[IÍ]A|CR[EÉ]DITO/.test(o))) res.pago='CR';
  if(/FACTURA/.test(o)){ res.notas.push('factura');
    if(res.pago==='TA_BOL') res.pago='TA_FAC'; }
  const cob=o.match(/COBRAR\s*\$?\s*([\d.,]+)/); if(cob) res.cobroExtra=parseMonto(cob[1]);
  const dol=o.match(/\$\s*([\d.,]+)/); if(dol) res.monto=parseMonto(dol[1]);
  else if(res.pago==='WEB'||res.pago==='TRANSF'){
    const fin=o.match(/(?:^|[\s,])(\d{1,3}(?:[.,]\d{3})+|\d{4,6})(?:\s|$)/);
    if(fin) res.monto=parseMonto(fin[1]); }
  return res;
}

/* --- texto de BOT / SODA a líneas de producto --- */
function parseProductos(botTxt,sodaTxt){
  const items=[];
  const add=(prod,cant,glosa)=>{ if(cant>0) items.push({prod,glosa:glosa||'',cant,precio:precioDe(prod)}); };
  const trozos=t=>String(t||'').split(/\+|,|\by\b/i);
  for(const tk of trozos(botTxt)){
    const m=tk.match(/(\d+)/); if(!m) continue;
    const n=parseInt(m[1],10), low=tk.toLowerCase();
    if(/poli/.test(low)) add('VASO_POLI_SL',n);
    else if(/nuev/.test(low)&&/(natura|eka|gen[eé]r)/.test(low)) add('BOT20_ENV_GEN',n);
    else if(/nuev/.test(low)) add('BOT20_ENV',n);
    else if(/eka/.test(low)) add('REC_BOT20',n,'EKA');
    else if(/natura/.test(low)) add('REC_BOT20',n,'Natura');
    else add('REC_BOT20',n);
  }
  for(const tk of trozos(sodaTxt)){
    const m=tk.match(/(\d+)/); if(!m) continue;
    const n=parseInt(m[1],10), low=tk.toLowerCase();
    if(/nuev/.test(low)) add('SODA_NUEVA',n); else add('REC_SODA',n);
  }
  return items;
}

function crearParada(zona,f,origen){
  const sug=clasificarObs(f.obs);
  return {id:uid(),zona:zona||'',dir:f.dir||'(sin dirección)',botTxt:f.bot||'',sodaTxt:f.soda||'',
    contacto:f.contacto||'',obs:f.obs||'',sug,estado:'pend',pago:null,
    productos:parseProductos(f.bot,f.soda),transferOk:false,cobroExtra:null,montoManual:null,
    nota:'',origen:origen||'excel'};
}

/* ============================================================
   CÁLCULO CENTRAL
   ============================================================ */
function montoParada(p){
  if(p.montoManual!=null&&p.montoManual!=='') return num(p.montoManual);
  return p.productos.reduce((s,l)=>s+(+l.cant||0)*(+l.precio||0),0);
}
function calc(){
  const ent=state.paradas.filter(p=>p.estado==='ent');
  const rendirCant={}, creditoCant={};
  const ing={EF:0,CHEQUE:0,TA_BOL:0,TA_FAC:0,TRANSF:0,DEUDA:0};
  const transf=[], deudas=[], webs=[], creditos=[];
  let pagosDeudasAuto=0;

  for(const p of ent){
    const m=montoParada(p);
    const dest=(p.pago==='CR'||p.pago==='WEB')?creditoCant:rendirCant;
    for(const l of p.productos){ if(!l.cant) continue;
      dest[l.prod]=(dest[l.prod]||0)+(+l.cant||0); }
    if(p.pago==='CR') creditos.push({nombre:p.dir,monto:m});
    else if(p.pago==='WEB') webs.push({nombre:p.dir,monto:m,ped:p.sug.web});
    else if(p.pago==='TRANSF'){ transf.push({nombre:p.dir,monto:m,pagado:!!p.transferOk,pid:p.id});
      ing.TRANSF+=m; }
    else if(p.pago==='DEUDA'){ deudas.push({nombre:p.dir,monto:m}); ing.DEUDA+=m; }
    else if(p.pago&&ing[p.pago]!=null) ing[p.pago]+=m;
    if(p.cobroExtra) pagosDeudasAuto+=num(p.cobroExtra);
  }
  state.transfExtra.forEach((t,i)=>{ transf.push({nombre:t.nombre,monto:num(t.monto),pagado:!!t.pagado,idx:i});
    ing.TRANSF+=num(t.monto); });
  for(const d of state.deudasExtra){ deudas.push({nombre:d.nombre,monto:num(d.monto)}); ing.DEUDA+=num(d.monto); }

  /* filas del lado A RENDIR */
  const rendirIds=[...new Set([...RENDIR_BASE,...Object.keys(rendirCant),...Object.keys(state.rendirManual)])];
  const rendirFilas=rendirIds.map(id=>{
    const auto=rendirCant[id]||0;
    const manual=state.rendirManual[id];
    const cant=(manual==null||manual==='')?auto:num(manual);
    const precio=(state.rendirPrecio[id]==null||state.rendirPrecio[id]==='')?precioDe(id):num(state.rendirPrecio[id]);
    return {id,auto,cant,precio,total:cant*precio,manual:manual!=null&&manual!==''};
  });
  let dineroARendir=rendirFilas.reduce((s,f)=>s+f.total,0);
  for(const e of state.rendirExtra) dineroARendir+=num(e.cant||1)*num(e.precio);

  /* filas del lado CRÉDITO */
  const credIds=[...new Set([...CREDITO_BASE,...Object.keys(creditoCant),...Object.keys(state.creditoManual)])];
  const credFilas=credIds.map(id=>{
    const auto=creditoCant[id]||0;
    const manual=state.creditoManual[id];
    const cant=(manual==null||manual==='')?auto:num(manual);
    return {id,auto,cant,est:cant*precioDe(id),manual:manual!=null&&manual!==''};
  });
  const creditoEst=credFilas.reduce((s,f)=>s+f.est,0);

  /* ingresos efectivos (manual pisa a automático) */
  const ingEf={}; let totalIngresos=0;
  for(const k of Object.keys(ing)){
    const man=state.ingresosManual[k];
    ingEf[k]=(man==null||man==='')?ing[k]:num(man);
    totalIngresos+=ingEf[k];
  }
  const pagosDeudas=(state.pagosDeudasManual==null||state.pagosDeudasManual==='')?pagosDeudasAuto:num(state.pagosDeudasManual);
  const gastos=num(state.gastos);
  const totalARendir=dineroARendir+pagosDeudas-gastos;
  const dif=totalIngresos-totalARendir;

  const porCobrar=[...transf.filter(t=>!t.pagado).map(t=>({tipo:'Transferencia pendiente',...t})),
                   ...deudas.map(d=>({tipo:'Deuda del día',...d}))];
  const transfPend=transf.filter(t=>!t.pagado).reduce((s,t)=>s+t.monto,0);
  const transfConf=transf.filter(t=>t.pagado).reduce((s,t)=>s+t.monto,0);

  /* física: totales de vueltas + chequeo */
  const fis={};
  for(const g of ['sif','b20','b10']){
    const t={salida:0,recarga:0,llenos:0,cambios:0,vendidos:0,venta:0};
    for(const v of state.vueltas){ for(const k in v[g]) t[k]+=num(v[g][k]); }
    const vend=g==='sif'?t.vendidos:t.venta;
    t.cuenta=t.recarga+t.llenos+t.cambios+vend;
    t.dif=t.salida-t.cuenta;
    fis[g]=t;
  }
  /* según pedidos entregados (referencia) */
  const segunPedidos={
    recSoda:rendirCant.REC_SODA||0, sodaNueva:rendirCant.SODA_NUEVA||0,
    rec20:(rendirCant.REC_BOT20||0)+(creditoCant.REC_BOT20||0),
    env20:(rendirCant.BOT20_ENV||0)+(rendirCant.BOT20_ENV_GEN||0)+(creditoCant.BOT20_ENV||0)+(creditoCant.BOT20_ENV_GEN||0),
    rec10:(rendirCant.REC_BOT10||0)+(creditoCant.REC_BOT10||0),
  };
  segunPedidos.recSoda+= (creditoCant.REC_SODA||0);
  segunPedidos.sodaNueva+=(creditoCant.SODA_NUEVA||0);

  const pendientes=state.paradas.filter(p=>p.estado==='pend').length;
  return {ent,rendirFilas,dineroARendir,credFilas,creditoEst,creditos,webs,
    ingAuto:ing,ingEf,totalIngresos,pagosDeudas,pagosDeudasAuto,gastos,totalARendir,dif,
    transf,transfPend,transfConf,deudas,porCobrar,fis,segunPedidos,pendientes};
}

/* ---------------- PEDIDOS ---------------- */

  const c=calc();
  const nE=state.paradas.filter(p=>p.estado==='ent').length,
        nP=state.paradas.filter(p=>p.estado==='pend').length,
        nN=state.paradas.filter(p=>p.estado==='no').length;
  $('#v-pedidos').innerHTML=`

    ${state.archivoPedidos?`<p class="small muted" style="margin:0 0 8px">Archivo: <b>${esc(state.archivoPedidos)}</b></p>`:''}
    <div class="btnrow">
      <button class="btn" onclick="A.pickPedidos()">📄 Cargar Excel de pedidos</button>
      <button class="btn sec" onclick="A.addManual()">+ Agregar cliente</button>
    </div>
    ${state.paradas.length?`
    <div class="btnrow mt">

      <button class="btn mini ${ui.filtro==='ent'?'':'ghost'}" onclick="A.filtro('ent')">Entregados (${nE})</button>
      <button class="btn mini ${ui.filtro==='no'?'':'ghost'}" onclick="A.filtro('no')">No entregados (${nN})</button>
    </div>
    <input class="mt" placeholder="Buscar dirección…" value="${esc(ui.q||'')}" oninput="ui.q=this.value;renderListaParadas()">`:''}
  </div>

}
function resumenProds(p){
  if(!p.productos.length) return '<span class="tag t-gris">sin productos</span>';
  return p.productos.map(l=>`<span class="tag t-gris">${l.cant} ${esc(PROD[l.prod]?.corto||l.prod)}${l.glosa?' '+esc(l.glosa):''}</span>`).join(' ');
}
function renderListaParadas(){
  const cont=$('#listaParadas'); if(!cont) return;
  const q=(ui.q||'').toLowerCase();
  let html='', zonaAct=null;
  for(const p of state.paradas){
    if(ui.filtro!=='todos'&&p.estado!==ui.filtro) continue;
    if(q&&!(p.dir.toLowerCase().includes(q)||(p.zona||'').toLowerCase().includes(q))) continue;
    if(p.zona!==zonaAct){ zonaAct=p.zona; if(zonaAct) html+=`<div class="zona">${esc(zonaAct)}</div>`; }
    const est=p.estado==='ent'?'p-entregado':(p.estado==='no'?'p-no':'p-pend');
    const pagoTag=p.pago?`<span class="tag ${PAGOS[p.pago].cls}">${PAGOS[p.pago].tag}</span>`
      :(p.sug.pago?`<span class="tag t-ambar">sug: ${PAGOS[p.sug.pago].tag} — confirmar</span>`:'');
    const trTag=(p.pago==='TRANSF')?(p.transferOk?'<span class="tag t-verde">TRANSF ✓ PAGADA</span>':'<span class="tag t-rojo">TRANSF PENDIENTE</span>'):'';
    html+=`
    <div class="parada ${est}" onclick="A.abrirParada('${p.id}')">
      <div class="dir">${esc(p.dir)} ${p.estado==='ent'?'<span class="chk-ok">✓</span>':(p.estado==='no'?'<span class="chk-bad">✗</span>':'')}</div>
      <div class="linea2">${resumenProds(p)} ${pagoTag} ${trTag}
        <span class="monto-p">${p.estado==='ent'?fmt$(montoParada(p)):''}</span></div>
      ${p.obs?`<div class="obs">📝 ${esc(p.obs)}</div>`:''}
      ${p.contacto?`<div class="obs">📞 ${esc(p.contacto)}</div>`:''}
    </div>`;
  }
  cont.innerHTML=html||'<p class="muted" style="text-align:center">No hay clientes que mostrar aún.<br>Carga el Excel de pedidos o agrega clientes a mano.</p>';
}

    <div class="kpi"><div class="k-lab">Tarjetas</div><div class="k-val">${fmt$(tarj)}</div></div>
    <div class="kpi"><div class="k-lab">Transf. confirmadas</div><div class="k-val">${fmt$(c.transfConf)}</div></div>
    <div class="kpi ${c.transfPend?'k-rojo':''}"><div class="k-lab">Transf. por cobrar</div><div class="k-val">${fmt$(c.transfPend)}</div></div>
    <div class="kpi"><div class="k-lab">Crédito + web (est.)</div><div class="k-val">${fmt$(c.creditoEst)}</div></div>
    <div class="kpi ${fisAlguna?(fisOk?'k-verde':'k-rojo'):''}"><div class="k-lab">Física envases</div><div class="k-val">${fisAlguna?(fisOk?'✓ cuadra':'revisar'):'—'}</div></div>
  </div>

  ${c.porCobrar.length?`
  <div class="card mt">
    <h2>⚠ Por cobrar — avisar a estos clientes</h2>
    ${c.porCobrar.map(x=>`<div class="cobro-item"><span><b>${esc(x.tipo)}</b><br>${esc(x.nombre)}</span><b>${fmt$(x.monto)}</b></div>`).join('')}
    <p class="small" style="text-align:right"><b>Total por cobrar: ${fmt$(c.porCobrar.reduce((s,x)=>s+x.monto,0))}</b></p>
  </div>`:''}

  <div class="card mt">
    <h2>Acciones</h2>
    <div class="btnrow">
      <button class="btn" onclick="A.imprimir()">🖨 Imprimir hoja del día</button>
      <button class="btn verde" onclick="A.descargarRespaldo()">⬇ Descargar respaldo</button>
      <button class="btn sec" onclick="A.cargarRespaldo()">⬆ Cargar respaldo</button>
    </div>
    <p class="muted small mt">La hoja imprimible reproduce el “Recibo Diario de Dinero” y los “Datos de Entrada y Salida”. El respaldo es un archivo que puedes guardar o reenviar y volver a abrir aquí.</p>
  </div>`;
}

/* ---------------- IMPRESIÓN ---------------- */
function renderPrint(){
  const c=calc();
  const F=x=>x?esc(x):'________';
  const filaF=(g,nom)=>{const t=c.fis[g];
    return `<tr><td><b>${nom}</b></td><td>${t.salida||''}</td><td>${t.recarga||''}</td><td>${t.llenos||''}</td><td>${(g==='sif'?t.vendidos:t.venta)||''}</td><td>${t.cambios||''}</td>
    <td>${t.salida||t.cuenta?(t.dif===0?'✓':('DIF '+t.dif)):''}</td></tr>`;};
  $('#printview').innerHTML=`
  <div class="pagina">
    <div class="pt-titulo">SODATAL — DATOS DE ENTRADA Y SALIDA</div>
    <div class="pt-head"><span><b>FECHA:</b> ${F(state.fecha.split('-').reverse().join('/'))}</span>
      <span><b>VENDEDOR:</b> ${F(state.vendedor)}</span><span><b>FURG.:</b> ${F(state.furgon)}</span>
      <span><b>RUTA:</b> ${F(state.ruta)}</span>
      <span><b>KM:</b> ${F(state.kmIni)} → ${F(state.kmFin)}</span></div>
    ${state.vueltas.map((v,i)=>`
      <div class="pt-secc">VUELTA ${i+1}</div>
      <table class="pt"><tr><th></th><th>SALIDA</th><th>RECARGA</th><th>LLENOS</th><th>VENDIDOS</th><th>CAMBIOS</th></tr>
      <tr><td>Sifones 1.500 cc</td><td>${v.sif.salida||''}</td><td>${v.sif.recarga||''}</td><td>${v.sif.llenos||''}</td><td>${v.sif.vendidos||''}</td><td>${v.sif.cambios||''}</td></tr>
      <tr><td>Botellones 20 L</td><td>${v.b20.salida||''}</td><td>${v.b20.recarga||''}</td><td>${v.b20.llenos||''}</td><td>${v.b20.venta||''}</td><td>${v.b20.cambios||''}</td></tr>
      <tr><td>Botellones 10 L</td><td>${v.b10.salida||''}</td><td>${v.b10.recarga||''}</td><td>${v.b10.llenos||''}</td><td>${v.b10.venta||''}</td><td>${v.b10.cambios||''}</td></tr>
      </table>`).join('')}
    <div class="pt-secc">TOTAL DEL DÍA — CUADRATURA FÍSICA</div>
    <table class="pt"><tr><th></th><th>SALIDA</th><th>RECARGA</th><th>LLENOS</th><th>VENDIDOS</th><th>CAMBIOS</th><th>CHEQUEO</th></tr>
      ${filaF('sif','Sifones')}${filaF('b20','Bot. 20 L')}${filaF('b10','Bot. 10 L')}</table>
    <div class="pt-secc">ACCESORIOS</div>
    <table class="pt"><tr><th></th>${ACC_ITEMS.map(id=>`<th>${esc(PROD[id].corto)}</th>`).join('')}</tr>
      <tr><td><b>SALIDA</b></td>${ACC_ITEMS.map(id=>`<td>${state.accesorios.salida[id]||''}</td>`).join('')}</tr>
      <tr><td><b>VENTA</b></td>${ACC_ITEMS.map(id=>`<td>${state.accesorios.venta[id]||''}</td>`).join('')}</tr></table>
    <div class="pt-secc">OTROS</div>
    <table class="pt"><tr><td>${esc(state.combustible.tipo||'BENCINA / DIESEL')}: ${F(state.combustible.monto&&fmt$(state.combustible.monto))}</td>
      <td>N° FACTURA: ${F(state.combustible.factura)}</td><td>RUT: ${F(state.combustible.rut)}</td></tr></table>
  </div>

  <div class="pagina">
    <div class="pt-titulo">SODATAL — RECIBO DIARIO DE DINERO</div>
    <div class="pt-head"><span><b>VENDEDOR:</b> ${F(state.vendedor)}</span>
      <span><b>FECHA:</b> ${F(state.fecha.split('-').reverse().join('/'))}</span>
      <span><b>KM TOTAL:</b> ${state.kmIni&&state.kmFin?num(state.kmFin)-num(state.kmIni):'____'}</span></div>
    <div class="pt-cols">
      <div>
        <div class="pt-secc">GUÍAS, FACTURAS A CRÉDITO Y WEB</div>
        <table class="pt"><tr><th>PRODUCTO</th><th>CANT.</th></tr>
          ${c.credFilas.filter(f=>f.cant).map(f=>`<tr><td>${esc(PROD[f.id].nombre)}</td><td>${f.cant}</td></tr>`).join('')||'<tr><td colspan="2">—</td></tr>'}
        </table>
        ${c.creditos.length?`<table class="pt" style="margin-top:4px"><tr><th>CLIENTE CRÉDITO</th><th>$ EST.</th></tr>
          ${c.creditos.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${fmt$(x.monto)}</td></tr>`).join('')}</table>`:''}
        ${c.webs.length?`<table class="pt" style="margin-top:4px"><tr><th>PEDIDO WEB</th><th>$</th></tr>
          ${c.webs.map(x=>`<tr><td>${x.ped?'P'+esc(x.ped)+' — ':''}${esc(x.nombre)}</td><td>${fmt$(x.monto)}</td></tr>`).join('')}</table>`:''}
      </div>
      <div>
        <div class="pt-secc">VENTAS DEL DÍA — A RENDIR</div>
        <table class="pt"><tr><th>PRODUCTO</th><th>CANT.</th><th>PRECIO</th><th>$</th></tr>
          ${c.rendirFilas.filter(f=>f.cant).map(f=>`<tr><td>${esc(PROD[f.id].nombre)}</td><td>${f.cant}</td><td>${fmt$(f.precio)}</td><td>${fmt$(f.total)}</td></tr>`).join('')}
          ${state.rendirExtra.filter(e=>e.precio).map(e=>`<tr><td>${esc(e.glosa||'Otro')}</td><td>${e.cant||1}</td><td>${fmt$(e.precio)}</td><td>${fmt$(num(e.cant||1)*num(e.precio))}</td></tr>`).join('')}
          <tr><td colspan="3"><b>DINERO A RENDIR</b></td><td><b>${fmt$(c.dineroARendir)}</b></td></tr>
          <tr><td colspan="3">+ PAGOS DEUDAS</td><td>${fmt$(c.pagosDeudas)}</td></tr>
          <tr><td colspan="3">− GASTOS ${state.gastosDetalle?('('+esc(state.gastosDetalle)+')'):''}</td><td>${fmt$(c.gastos)}</td></tr>
          <tr><td colspan="3"><b>TOTAL A RENDIR</b></td><td><b>${fmt$(c.totalARendir)}</b></td></tr>
        </table>
      </div>
    </div>
    <div class="pt-cols" style="margin-top:8px">
      <div>
        <div class="pt-secc">INGRESOS</div>
        <table class="pt">
          <tr><td>EFECTIVO</td><td>${fmt$(c.ingEf.EF)}</td></tr>
          <tr><td>CHEQUES</td><td>${fmt$(c.ingEf.CHEQUE)}</td></tr>
          <tr><td>TARJETAS BOLETA</td><td>${fmt$(c.ingEf.TA_BOL)}</td></tr>
          <tr><td>TARJETAS FACTURA</td><td>${fmt$(c.ingEf.TA_FAC)}</td></tr>
          <tr><td>TRANSFERENCIAS</td><td>${fmt$(c.ingEf.TRANSF)}</td></tr>
          <tr><td>DEUDAS</td><td>${fmt$(c.ingEf.DEUDA)}</td></tr>
          <tr><td><b>TOTAL</b></td><td><b>${fmt$(c.totalIngresos)}</b></td></tr>
          <tr><td><b>DIFERENCIA</b></td><td><b>${c.dif===0?'✓ CUADRADO':fmt$(c.dif)}</b></td></tr>
        </table>
      </div>
      <div>
        <div class="pt-secc">DETALLE TRANSFERENCIAS</div>
        <table class="pt"><tr><th>NOMBRE</th><th>MONTO</th><th>ESTADO</th></tr>
          ${c.transf.map(t=>`<tr><td>${esc(t.nombre)}</td><td>${fmt$(t.monto)}</td><td>${t.pagado?'PAGADA ✓':'<b>PENDIENTE</b>'}</td></tr>`).join('')||'<tr><td colspan="3">—</td></tr>'}
        </table>
        <div class="pt-secc">DETALLE DEUDAS</div>
        <table class="pt"><tr><th>NOMBRE</th><th>MONTO</th></tr>
          ${c.deudas.map(d=>`<tr><td>${esc(d.nombre)}</td><td>${fmt$(d.monto)}</td></tr>`).join('')||'<tr><td colspan="2">—</td></tr>'}
        </table>
      </div>
    </div>
    ${c.porCobrar.length?`<div class="pt-alerta"><b>POR COBRAR (${fmt$(c.porCobrar.reduce((s,x)=>s+x.monto,0))}):</b>
      ${c.porCobrar.map(x=>`${esc(x.nombre)} (${esc(x.tipo.toLowerCase())}: ${fmt$(x.monto)})`).join(' · ')}</div>`:''}
    <div class="pt-firma"><div>FIRMA VENDEDOR</div><div>REVISADO / VISTO BUENO</div></div>
  </div>`;
}
</script>
<script>
/* ============================================================
   ACCIONES
   ============================================================ */
const A={
  tab(t){ ui.tab=t; render(); },
  set(path,val){ const ks=path.split('.'); let o=state; while(ks.length>1)o=o[ks.shift()]; o[ks[0]]=val; render(); },
  setPrecio(id,val){ state.precios[id]=num(val); renderTop(); },
  filtro(f){ ui.filtro=f; renderPedidos(); },

  /* ---- paradas ---- */
  pickPedidos(){ $('#filePedidos').click(); },
  addManual(){ abrirEditor(crearParada('AGREGADOS EN RUTA',{dir:'',bot:'',soda:'',contacto:'',obs:''},'manual')); },
  abrirParada(id){ const p=state.paradas.find(x=>x.id===id); if(p) abrirEditor(p); },
  cerrarEditor(){ ui.editParada=null; $('#modal').innerHTML=''; },
  ep(campo,val){ ui.editParada[campo]=val; renderEditor(); },
  epProd(i,campo,val){ const l=ui.editParada.productos[i];
    if(campo==='prod'){ l.prod=val; l.precio=precioDe(val); } else l[campo]=num(val);
    renderEditor(); },
  epDelProd(i){ ui.editParada.productos.splice(i,1); renderEditor(); },
  epAddProd(){ ui.editParada.productos.push({prod:'REC_BOT20',glosa:'',cant:1,precio:precioDe('REC_BOT20')}); renderEditor(); },
  aplicarSug(){ const P=ui.editParada, s=P.sug||{};
    if(s.pago) P.pago=s.pago;
    P.transferOk=!!s.transferOk;
    if(s.cobroExtra) P.cobroExtra=s.cobroExtra;
    if(s.monto){ const t=P.productos.reduce((a,l)=>a+(+l.cant||0)*(+l.precio||0),0);
      if(t!==s.monto) P.montoManual=s.monto; }
    renderEditor(); },
  guardarParada(){ const P=ui.editParada;
    if(P.estado==='ent'&&!P.pago){ alert('Antes de guardar la entrega indica cómo pagó (o marca Crédito, Web o Deuda).'); return; }
    if(!String(P.dir||'').trim()) P.dir='(sin dirección)';
    const i=state.paradas.findIndex(x=>x.id===P.id);
    if(i>=0) state.paradas[i]=P; else state.paradas.push(P);
    A.cerrarEditor(); render(); },
  borrarParada(){ if(!confirm('¿Eliminar este cliente de la lista?')) return;
    state.paradas=state.paradas.filter(x=>x.id!==ui.editParada.id);
    A.cerrarEditor(); render(); },

  /* ---- importación del Excel de pedidos ---- */
  async selHoja(idx){
    const im=ui.importa; im.sel=+idx;
    try{
      const h=im.lector.hojas[im.sel];
      im.bloques=parsearBloques(await im.lector.matriz(h.archivo));
    }catch(e){ im.bloques=[]; }
    im.selB=new Set();
    const vend=(state.vendedor||'').toUpperCase().split(/[\s\-]+/).filter(x=>x.length>2);
    im.bloques.forEach((b,i)=>{ const T=b.titulo.toUpperCase();
      if(vend.some(w=>T.includes(w))) im.selB.add(i); });
    if(!im.selB.size&&im.bloques.length===1) im.selB.add(0);
    renderImporta(); },
  toggleBloque(i){ const s=ui.importa.selB; s.has(i)?s.delete(i):s.add(i); renderImporta(); },
  setModo(m){ ui.importa.modo=m; renderImporta(); },
  cerrarImporta(){ ui.importa=null; $('#modal').innerHTML=''; },
  importar(){
    const im=ui.importa;
    if(im.sel==null||!im.selB.size){ alert('Elige la hoja del día y al menos una ruta.'); return; }
    const nuevas=[];
    for(const bi of [...im.selB].sort((a,b)=>a-b)){
      const b=im.bloques[bi]; let zona='';
      for(const f of b.filas){
        if(f.tipo==='zona'){ zona=f.nombre; continue; }
        nuevas.push(crearParada(zona,f,'excel'));
      }
    }
    if(im.modo==='reemplazar'){ state.paradas=nuevas; }
    else state.paradas.push(...nuevas);
    state.archivoPedidos=im.nombre+' · hoja '+im.hojas[im.sel];
    ui.importa=null; $('#modal').innerHTML=''; ui.filtro='todos'; ui.q='';
    render(); },

  /* ---- vueltas / accesorios ---- */
  setV(i,g,k,val){ state.vueltas[i][g][k]=num(val); renderCarga(); renderTop(); },
  addVuelta(){ state.vueltas.push(vueltaVacia()); renderCarga(); },
  delVuelta(i){ state.vueltas.splice(i,1); if(!state.vueltas.length) state.vueltas.push(vueltaVacia()); renderCarga(); },
  setAcc(t,id,val){ state.accesorios[t][id]=num(val); },

  /* ---- dinero ---- */
  setRendCant(id,val){ state.rendirManual[id]=(val===''?null:num(val)); if(val==='')delete state.rendirManual[id]; renderDinero(); renderTop(); },
  resetRend(id){ delete state.rendirManual[id]; renderDinero(); renderTop(); },
  setRendPrecio(id,val){ if(val==='')delete state.rendirPrecio[id]; else state.rendirPrecio[id]=num(val); renderDinero(); renderTop(); },
  addRendExtra(){ state.rendirExtra.push({glosa:'',cant:1,precio:''}); renderDinero(); },
  setRendExtra(i,k,v){ state.rendirExtra[i][k]=v; renderDinero(); renderTop(); },
  delRendExtra(i){ state.rendirExtra.splice(i,1); renderDinero(); renderTop(); },
  setCredCant(id,val){ if(val==='')delete state.creditoManual[id]; else state.creditoManual[id]=num(val); renderDinero(); },
  resetCred(id){ delete state.creditoManual[id]; renderDinero(); },
  setIng(k,val){ state.ingresosManual[k]=(val===''?null:val); renderDinero(); renderTop(); },
  resetIng(k){ state.ingresosManual[k]=null; renderDinero(); renderTop(); },
  toggleTransfParada(pid){ const p=state.paradas.find(x=>x.id===pid);
    if(p){ p.transferOk=!p.transferOk; renderDinero(); renderTop(); } },
  addTransfExtra(){ state.transfExtra.push({nombre:'',monto:'',pagado:false}); renderDinero(); },
  setTransfExtra(i,k,v){ state.transfExtra[i][k]=v; renderDinero(); renderTop(); },
  toggleTransfExtra(i){ state.transfExtra[i].pagado=!state.transfExtra[i].pagado; renderDinero(); renderTop(); },
  delTransfExtra(i){ state.transfExtra.splice(i,1); renderDinero(); renderTop(); },
  addDeudaExtra(){ state.deudasExtra.push({nombre:'',monto:''}); renderDinero(); },
  setDeudaExtra(i,k,v){ state.deudasExtra[i][k]=v; renderDinero(); renderTop(); },
  delDeudaExtra(i){ state.deudasExtra.splice(i,1); renderDinero(); renderTop(); },

  /* ---- respaldo / impresión ---- */
  descargarRespaldo(){
    const data=JSON.stringify({app:'cuadratura-sodatal',version:1,guardado:new Date().toISOString(),state});
    const blob=new Blob([data],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`cuadratura_${(state.vendedor||'vendedor').replace(/\s+/g,'-')}_${state.fecha}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000); },
  cargarRespaldo(){ $('#fileRespaldo').click(); },
  reiniciar(){ if(!confirm('¿Empezar un día nuevo? Se borra todo lo que no esté respaldado.')) return;
    const pre=state.precios, v=state.vendedor;
    state=estadoNuevo(); state.precios=pre; state.vendedor=v;
    ui.filtro='todos'; ui.q=''; render(); },
  imprimir(){ renderPrint(); setTimeout(()=>window.print(),60); },
};

function renderImporta(){
  const im=ui.importa; if(!im){ $('#modal').innerHTML=''; return; }
  $('#modal').innerHTML=`
  <div class="velo"><div class="hoja">
    <div style="display:flex;align-items:center;gap:8px">
      <h3 style="flex:1">Importar pedidos — ${esc(im.nombre)}</h3>
      <button class="btn mini ghost" onclick="A.cerrarImporta()">✕</button>
    </div>
    <label class="mt">Hoja (día)</label>
    <select onchange="A.selHoja(this.value)">
      ${im.hojas.map((n,i)=>`<option value="${i}" ${i===im.sel?'selected':''}>${esc(n)}</option>`).join('')}
    </select>
    <label class="mt">¿Qué ruta importas?</label>
    <div class="bloque-pick">
      ${im.bloques.length?im.bloques.map((b,i)=>{
        const nCli=b.filas.filter(f=>f.tipo==='cliente').length;
        return `<label class="bp ${im.selB.has(i)?'on':''}">
          <input type="checkbox" ${im.selB.has(i)?'checked':''} onchange="A.toggleBloque(${i})">
          <span><b>${esc(b.titulo)}</b><br><span class="muted small">${nCli} clientes</span></span></label>`;
      }).join(''):'<p class="muted small">Esta hoja no tiene clientes anotados todavía (o no es una hoja de pedidos). Prueba con otra hoja.</p>'}
    </div>
    ${state.paradas.length?`
    <label class="mt">Los clientes actuales…</label>
    <div class="bloque-pick">
      <label class="bp ${im.modo==='reemplazar'?'on':''}"><input type="radio" name="modoImp" ${im.modo==='reemplazar'?'checked':''} onchange="A.setModo('reemplazar')"><span>Reemplazar la lista actual</span></label>
      <label class="bp ${im.modo==='agregar'?'on':''}"><input type="radio" name="modoImp" ${im.modo==='agregar'?'checked':''} onchange="A.setModo('agregar')"><span>Agregar al final de la lista</span></label>
    </div>`:''}
    <button class="btn verde wide mt" onclick="A.importar()">Importar pedidos</button>
    <p class="muted small mt">Las observaciones (TA, EF, CR, “Transferido”, “P####”) se leen como <b>sugerencias</b>: siempre debes confirmarlas cliente por cliente.</p>
  </div></div>`;
}

/* ---------- arranque ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  $$('#tabs button').forEach(b=>b.addEventListener('click',()=>A.tab(b.dataset.tab)));
  $('#filePedidos').addEventListener('change',async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    if(typeof DecompressionStream==='undefined'){
      alert('Este navegador es muy antiguo y no puede leer Excel. Actualiza Chrome/Safari, o agrega los clientes a mano.'); return; }
    try{
      const lector=await leerXlsx(await f.arrayBuffer());
      ui.importa={lector,nombre:f.name,hojas:lector.hojas.map(h=>h.nombre),sel:null,bloques:[],selB:new Set(),
        modo:state.paradas.length?'agregar':'reemplazar'};
      const d=new Date(state.fecha+'T12:00:00');
      const diaNum=d.getDate();
      const diaSem=d.toLocaleDateString('es-CL',{weekday:'long'}).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
      let pre=0, mejorPts=0;
      ui.importa.hojas.forEach((n,i)=>{
        if(/FIJO/i.test(n)) return;
        const N=String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
        let pts=0;
        if(diaSem&&N.includes(diaSem)) pts+=3;
        const nums=(N.match(/\d+/g)||[]).map(Number);
        if(nums.includes(diaNum)) pts+=2;
        if(pts>mejorPts){ mejorPts=pts; pre=i; }
      });
      await A.selHoja(pre);
    }catch(err){ alert('No se pudo leer el archivo: '+(err.message||err)); }
  });
  $('#fileRespaldo').addEventListener('change',e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    f.text().then(t=>{
      const d=JSON.parse(t);
      if(!d||d.app!=='cuadratura-sodatal'||!d.state) throw new Error('formato');
      state=Object.assign(estadoNuevo(),d.state);
      state.precios=Object.assign(Object.fromEntries(PRODUCTOS.map(p=>[p.id,p.precio])),d.state.precios||{});
      ui.filtro='todos'; ui.q=''; ui.tab='resumen';
      render();
    }).catch(()=>alert('El archivo no es un respaldo válido de la app.'));
  });
  render();
});
</script>
</body>
</html>
