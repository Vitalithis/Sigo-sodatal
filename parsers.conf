# ==============================================================================
# FLUENT BIT PARSERS - SIGO-SODATAL
# Parser optimizado para extraer eventos JSON sin sobrecarga de cómputo
# ==============================================================================

[PARSER]
    Name        json_app
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
