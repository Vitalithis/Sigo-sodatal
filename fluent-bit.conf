# ==============================================================================
# FLUENT BIT CONFIGURATION - SIGO-SODATAL
# Arquitectura: Recolección asíncrona de logs JSON de ultra-bajo consumo
# Consumo estimado de Fluent Bit: ~5MB a 12MB RAM | <0.5% CPU
# ==============================================================================

[SERVICE]
    # Intervalo de volcado del buffer a disco en segundos (1s garantiza mínima latencia sin sobrecargar CPU)
    Flush         1

    # Nivel de logging interno de Fluent Bit (info, warn, error)
    Log_Level     info

    # Ejecutar en primer plano (Off) para depuración, o en segundo plano (On) como demonio/servicio
    Daemon        Off

    # Archivo de definición de parsers (permite decodificar JSON estructurado)
    Parsers_File  parsers.conf

    # Desactivar métricas HTTP internas para no consumir puertos ni memoria adicional
    HTTP_Server   Off

# ==============================================================================
# INPUT: Lectura de logs generados por la aplicación
# ==============================================================================

# Opción A: Lectura por archivo stdout (Recomendado para servidores locales con PM2 / script de inicio)
# Node.js escribe a stdout > redirigido a ./logs/app-stdout.log
[INPUT]
    Name              tail
    Tag               sigo.web
    Path              ./logs/app-stdout.log
    # Archivo de base de datos SQLite ligera para recordar la última línea leída tras reinicios
    DB                ./logs/fluent-bit.db
    # Límite estricto de memoria para el buffer de lectura (evita picos de RAM)
    Mem_Buf_Limit     5MB
    # Ignora líneas no procesables o corruptas
    Skip_Long_Lines   On
    # Intervalo en segundos para verificar nuevas líneas en el archivo
    Refresh_Interval  2

# Opción B (Alternativa directa para pruebas con pipe: `npm run start | fluent-bit -c fluent-bit.conf`)
# Descomentar si se ejecuta mediante tubería directa:
# [INPUT]
#     Name        stdin
#     Tag         sigo.web

# ==============================================================================
# FILTER: Parser JSON para validar y estructurar los eventos
# ==============================================================================
[FILTER]
    Name          parser
    Match         sigo.*
    Key_Name      log
    Parser        json_app
    Reserve_Data  True

# ==============================================================================
# OUTPUT: Almacenamiento local en disco con gestión de tamaño
# ==============================================================================
[OUTPUT]
    Name          file
    Match         sigo.*
    # Directorio destino de almacenamiento seguro de logs
    Path          ./logs/archive
    # Nombre del archivo consolidado
    File          sigo_operations.log
    # Formato de guardado plano (una línea JSON por evento, listo para grep o análisis)
    Format        plain

# Salida opcional por consola (útil para verificar que Fluent Bit está recibiendo eventos)
# [OUTPUT]
#     Name        stdout
#     Match       sigo.*
#     Format      json_lines
